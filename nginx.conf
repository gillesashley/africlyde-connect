# Host-level nginx site config for africlyde.co.uk
# Install: sudo cp nginx.conf /etc/nginx/sites-available/africlyde.co.uk
#          sudo ln -s /etc/nginx/sites-available/africlyde.co.uk /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then:    sudo certbot --nginx -d africlyde.co.uk -d www.africlyde.co.uk

server {
    listen 80;
    server_name africlyde.co.uk www.africlyde.co.uk;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
